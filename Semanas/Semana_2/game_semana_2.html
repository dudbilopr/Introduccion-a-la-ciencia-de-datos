<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Gamificado: Semana 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#003865', secondary: '#E85C0B', darkbg: '#0f172a', console: '#1e1e1e' }
                }
            }
        }
    </script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .door { transition: all 0.5s; }
        .door.unlocked { transform: translateY(-100%); opacity: 0; }
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-6">

    <div class="glass-panel w-full max-w-4xl rounded-2xl p-8 relative overflow-hidden">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-400 mb-2"><i class="fas fa-door-closed text-secondary mr-3"></i>Escape Room: "Pythonic"</h1>
            <p class="text-gray-300">Descifra la salida (Output) del código para abrir la puerta de seguridad del servidor.</p>
        </div>

        <div class="relative w-full h-[400px] flex items-center justify-center">
            
            <!-- Puertas Visuales -->
            <div id="door-overlay" class="absolute inset-0 bg-slate-800 flex items-center justify-center border-4 border-slate-600 rounded-xl door z-20 shadow-2xl">
                <div class="text-center">
                    <i class="fas fa-lock text-6xl text-gray-500 mb-4" id="lock-icon"></i>
                    <h2 class="text-2xl font-bold text-gray-400">Nivel de Seguridad: <span id="level-indicator">1</span>/3</h2>
                </div>
            </div>

            <!-- Panel de Código (Behind the door) -->
            <div class="w-full h-full flex flex-col gap-4 z-10 p-4">
                <div class="bg-console rounded-lg p-4 font-mono text-sm sm:text-base border border-gray-700 shadow-inner flex-1">
                    <div class="flex items-center gap-2 mb-2 border-b border-gray-700 pb-2">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        <span class="text-gray-400 text-xs ml-2">script.py</span>
                    </div>
                    <pre><code id="code-snippet" class="text-green-400"></code></pre>
                </div>
                
                <div class="flex gap-2" id="input-section">
                    <span class="bg-gray-800 text-green-500 font-mono px-4 py-3 rounded-l-lg border border-gray-700 border-r-0">Out[1]:</span>
                    <input type="text" id="user-input" class="flex-1 bg-gray-800 text-white font-mono px-4 py-3 border border-gray-700 focus:outline-none focus:border-blue-500 transition" placeholder="Escribe la salida exacta (ej: 42, 'hola', [1, 2])" onkeypress="handleEnter(event)">
                    <button onclick="checkAnswer()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 font-bold rounded-r-lg transition">HACK</button>
                </div>
            </div>
        </div>

        <div id="end-screen" class="absolute inset-0 bg-slate-900/95 backdrop-blur-xl rounded-2xl hidden flex-col items-center justify-center z-30 fade-in">
            <i class="fas fa-server text-7xl text-green-400 mb-6"></i>
            <h2 class="text-4xl font-bold text-white mb-2">¡Acceso Concedido!</h2>
            <p class="text-xl text-gray-300 mb-8">Dominas las estructuras de datos nativas de Python.</p>
            <button onclick="location.reload()" class="bg-secondary text-white font-bold px-8 py-3 rounded-lg hover:bg-orange-600 transition shadow-lg">Reiniciar Sistema</button>
        </div>
    </div>

    <script>
        const puzzles = [
            { 
                code: "lista = [10, 20, 30, 40, 50]\nprint(lista[1:3])", 
                ans: "[20, 30]" 
            },
            { 
                code: "user = {'id': 101, 'activo': True}\nuser['rol'] = 'admin'\nprint(user['rol'])", 
                ans: "'admin'" 
            },
            { 
                code: "x = [1, 2, 3]\ny = [x_i * 2 for x_i in x]\nprint(y)", 
                ans: "[2, 4, 6]" 
            }
        ];

        let currentLevel = 0;

        function loadPuzzle() {
            if(currentLevel >= puzzles.length) {
                document.getElementById('end-screen').style.display = 'flex';
                return;
            }
            
            // Cerrar puerta
            const door = document.getElementById('door-overlay');
            door.classList.remove('unlocked');
            document.getElementById('lock-icon').className = "fas fa-lock text-6xl text-gray-500 mb-4";
            document.getElementById('level-indicator').innerText = currentLevel + 1;
            
            // Cargar código
            document.getElementById('code-snippet').innerText = puzzles[currentLevel].code;
            document.getElementById('user-input').value = "";
            
            // Abrir puerta (animación)
            setTimeout(() => {
                door.classList.add('unlocked');
                document.getElementById('user-input').focus();
            }, 1000);
        }

        function checkAnswer() {
            const input = document.getElementById('user-input').value.trim();
            // Normalizar comillas dobles a simples para facilitar la validación
            const normalizedInput = input.replace(/"/g, "'").replace(/\s+/g, '');
            const normalizedAns = puzzles[currentLevel].ans.replace(/"/g, "'").replace(/\s+/g, '');
            
            if(normalizedInput === normalizedAns) {
                // Correcto
                document.getElementById('user-input').classList.add('bg-green-900', 'text-white');
                setTimeout(() => {
                    document.getElementById('user-input').classList.remove('bg-green-900', 'text-white');
                    currentLevel++;
                    loadPuzzle();
                }, 800);
            } else {
                // Incorrecto
                const section = document.getElementById('input-section');
                section.classList.add('shake');
                document.getElementById('user-input').classList.add('bg-red-900');
                setTimeout(() => {
                    section.classList.remove('shake');
                    document.getElementById('user-input').classList.remove('bg-red-900');
                }, 500);
            }
        }

        function handleEnter(e) {
            if(e.key === 'Enter') checkAnswer();
        }

        // Init
        loadPuzzle();
    </script>
</body>
</html>
