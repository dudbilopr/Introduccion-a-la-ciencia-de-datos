{"q": "Which line computes the mean number of rentals for each season?", "o": ["df.mean(\"season\")", "df.groupby(\"season\")[\"cnt\"].mean()", "df[\"season\"].mean()", "df.sort_values(\"season\")"], "a": 1, "e": "groupby splits the table, applies the mean to each group and combines the results."},

{"q": "Humidity contributes 93.3 % of the squared Euclidean distance. What should you do before comparing days?", "o": ["Delete the humidity column", "Standardise each variable, so units do not decide the distance", "Use only Manhattan", "Round the numbers"], "a": 1, "e": "Standardised, the distance is 3.153 and no single variable dominates. We return to this in week 13."}
