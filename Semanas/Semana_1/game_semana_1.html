<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Gamificado: Semana 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#003865', secondary: '#E85C0B', darkbg: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .venn-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }
        .circle {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            mix-blend-mode: screen;
            opacity: 0.6;
            cursor: pointer;
            transition: all 0.3s;
        }
        .circle:hover { opacity: 0.8; transform: scale(1.05); }
        .circle-c1 { background: #3b82f6; top: 0; left: 75px; } /* Hacking */
        .circle-c2 { background: #ef4444; bottom: 30px; left: 0; } /* Math */
        .circle-c3 { background: #10b981; bottom: 30px; right: 0; } /* Business */
        
        /* Intersections logic via transparent buttons on top */
        .intersection-btn {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .intersection-btn:hover { border-color: white; background: rgba(255,255,255,0.3); }
        
        .btn-ml { top: 120px; left: 100px; width: 60px; height: 60px; }
        .btn-danger { top: 120px; right: 100px; width: 60px; height: 60px; }
        .btn-trad { bottom: 100px; left: 170px; width: 60px; height: 60px; }
        .btn-ds { top: 160px; left: 170px; width: 60px; height: 60px; }
        
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-6">

    <div class="glass-panel w-full max-w-5xl rounded-2xl p-8 relative flex flex-col md:flex-row gap-8 items-center">
        
        <div class="flex-1 w-full text-center md:text-left">
            <h1 class="text-3xl font-bold text-blue-400 mb-2"><i class="fas fa-project-diagram text-secondary mr-3"></i>Simulador de Conway</h1>
            <p class="text-gray-300 mb-6">Haz clic en la zona correcta del Diagrama de Venn según la pista.</p>
            
            <div class="glass-panel p-6 rounded-xl relative fade-in" id="dialogue-box">
                <h3 class="text-sm font-bold text-secondary uppercase tracking-wider mb-2">Pista del Perfil</h3>
                <p class="text-xl text-gray-200" id="clue-text"></p>
            </div>
            
            <div class="mt-4 text-sm text-gray-400">
                <p><i class="fas fa-info-circle mr-1"></i> Puntos: <span id="score" class="text-white font-bold text-lg">0</span> / 4</p>
            </div>
        </div>

        <div class="flex-1 w-full flex justify-center">
            <div class="venn-container">
                <!-- Visual Circles -->
                <div class="circle circle-c1" title="Hacking Skills">Hacking<br>Skills</div>
                <div class="circle circle-c2" title="Math & Statistics">Math &<br>Stats</div>
                <div class="circle circle-c3" title="Substantive Expertise">Business<br>Expertise</div>
                
                <!-- Clickable Intersections -->
                <div class="intersection-btn btn-ml" onclick="checkAnswer('ML')" title="Machine Learning"></div>
                <div class="intersection-btn btn-danger" onclick="checkAnswer('Danger')" title="Danger Zone"></div>
                <div class="intersection-btn btn-trad" onclick="checkAnswer('Trad')" title="Traditional Research"></div>
                <div class="intersection-btn btn-ds" onclick="checkAnswer('DS')" title="Data Science (Unicornio)"></div>
            </div>
        </div>

        <div id="end-screen" class="absolute inset-0 bg-slate-900/95 backdrop-blur-xl rounded-2xl hidden flex-col items-center justify-center z-20 fade-in">
            <i class="fas fa-trophy text-7xl text-yellow-400 mb-6"></i>
            <h2 class="text-4xl font-bold text-white mb-2">¡Misión Cumplida!</h2>
            <p class="text-xl text-gray-300 mb-8">Comprendes el ADN de un Científico de Datos.</p>
            <button onclick="location.reload()" class="bg-secondary text-white font-bold px-8 py-3 rounded-lg hover:bg-orange-600 transition shadow-lg">Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        const clues = [
            { text: '"Sabe programar en Python, conoce el modelo de negocio, pero no sabe NADA de matemáticas ni validación estadística. ¡Puede concluir cosas falsas!"', ans: 'Danger' },
            { text: '"Es un experto en algoritmos y matemáticas, entrena redes neuronales increíbles, pero no entiende para qué sirve en la empresa."', ans: 'ML' },
            { text: '"Es un doctor en economía. Conoce su área a la perfección y domina la estadística clásica, pero usa Excel y no sabe automatizar código."', ans: 'Trad' },
            { text: '"El unicornio. Programa sistemas escalables, aplica inferencia probabilística y todo lo traduce a impacto económico (ROI)."', ans: 'DS' }
        ];

        let currentClue = 0;
        let score = 0;

        function renderClue() {
            if(currentClue >= clues.length) {
                document.getElementById('end-screen').style.display = 'flex';
                return;
            }
            const el = document.getElementById('clue-text');
            el.innerText = clues[currentClue].text;
            document.getElementById('dialogue-box').classList.remove('fade-in');
            void document.getElementById('dialogue-box').offsetWidth;
            document.getElementById('dialogue-box').classList.add('fade-in');
        }

        function checkAnswer(ans) {
            if(ans === clues[currentClue].ans) {
                score++;
                document.getElementById('score').innerText = score;
                currentClue++;
                renderClue();
            } else {
                const box = document.getElementById('dialogue-box');
                box.style.borderColor = '#ef4444';
                setTimeout(() => box.style.borderColor = 'rgba(255,255,255,0.1)', 300);
            }
        }
        
        renderClue();
    </script>
</body>
</html>
