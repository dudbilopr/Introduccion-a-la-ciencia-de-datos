<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Quiz - Data Structures & Loops</title>
    <style>
        :root {
            --data-blue: #003865;
            --data-orange: #E85C0B;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            border-top: 8px solid var(--data-orange);
        }

        h1 {
            color: var(--data-blue);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--data-blue);
        }

        .options {
            list-style-type: none;
            padding: 0;
        }

        .options li {
            background-color: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .options li:hover {
            background-color: #e6f0fa;
            border-color: var(--data-blue);
        }

        .options li.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .options li.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        #submit-btn {
            background-color: var(--data-orange);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            font-weight: bold;
            margin-top: 20px;
        }

        #submit-btn:hover {
            background-color: #cc5000;
        }

        #result {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            color: var(--data-blue);
            display: none;
        }
        
        .progress {
            text-align: right;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>EMI Space Challenge</h1>
    <p class="subtitle">Data Structures & Control Flow</p>

    <div class="progress" id="progressText">Question 1 of 3</div>
    
    <div id="quiz-block">
        <div class="question" id="questionText">Loading...</div>
        <ul class="options" id="optionsList">
            <!-- Opciones generadas por JS -->
        </ul>
        <div id="explanationBox" style="display: none; padding: 15px; margin-top: 15px; border-radius: 8px; background-color: #e9ecef; border-left: 5px solid var(--data-blue);">
            <strong>Explicación:</strong> <span id="explanationText"></span>
        </div>
    </div>

    <button id="submit-btn" onclick="checkAnswer()" style="display: none;">Submit Answer</button>
    
    <div id="result"></div>
</div>

<script src="../recursos/banco_preguntas.js"></script>
<script>
    // 1. Inicializar banco de preguntas (obtener 5 aleatorias del pool)
    let allQuestions = window.QuizBank ? window.QuizBank["ciencia_datos"] : [];
    
    // Función para barajar array
    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    // Seleccionamos solo 5 preguntas al azar para esta sesión (o todas si hay menos de 5)
    let questions = shuffleArray([...allQuestions]).slice(0, 5);

    let currentQuestion = 0;
    let score = 0;
    let selectedOptionIndex = -1;

    const questionText = document.getElementById("questionText");
    const optionsList = document.getElementById("optionsList");
    const progressText = document.getElementById("progressText");
    const submitBtn = document.getElementById("submit-btn");
    const resultDiv = document.getElementById("result");
    const quizBlock = document.getElementById("quiz-block");
    const explanationBox = document.getElementById("explanationBox");
    const explanationText = document.getElementById("explanationText");

    function loadQuestion() {
        if(questions.length === 0) {
            questionText.textContent = "Error: El banco de preguntas no se pudo cargar. Asegúrese de que banco_preguntas.js existe.";
            return;
        }

        selectedOptionIndex = -1;
        explanationBox.style.display = "none"; // Ocultar explicación al cambiar pregunta
        
        const q = questions[currentQuestion];
        // Mostrar tema y pregunta
        questionText.innerHTML = `<span style="font-size:0.8rem; color:#666; display:block; margin-bottom:5px;">[${q.tema}]</span>${q.pregunta}`;
        progressText.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        
        optionsList.innerHTML = "";
        q.opciones.forEach((opt, index) => {
            const li = document.createElement("li");
            li.textContent = opt;
            li.onclick = () => selectOption(li, index);
            optionsList.appendChild(li);
        });
        
        submitBtn.textContent = "Submit Answer";
        submitBtn.style.display = "block";
    }

    function selectOption(element, index) {
        const options = optionsList.children;
        for (let i = 0; i < options.length; i++) {
            options[i].style.borderColor = "#e0e0e0";
            options[i].style.backgroundColor = "#f9f9f9";
        }
        element.style.borderColor = "var(--data-blue)";
        element.style.backgroundColor = "#e6f0fa";
        selectedOptionIndex = index;
    }

    function checkAnswer() {
        if (selectedOptionIndex === -1) {
            alert("Please select an option first!");
            return;
        }

        const q = questions[currentQuestion];
        const options = optionsList.children;

        // Si ya respondimos y dimos clic en "Siguiente"
        if (submitBtn.textContent === "Next Question" || submitBtn.textContent === "Show Results") {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showFinalResults();
            }
            return;
        }

        // Evaluar respuesta
        if (selectedOptionIndex === q.respuestaCorrecta) {
            options[selectedOptionIndex].classList.add("correct");
            score++;
        } else {
            options[selectedOptionIndex].classList.add("incorrect");
            options[q.respuestaCorrecta].classList.add("correct");
        }

        // Mostrar Explicación Guiada
        explanationText.textContent = q.explicacion;
        explanationBox.style.display = "block";

        // Actualizar botón
        if (currentQuestion < questions.length - 1) {
            submitBtn.textContent = "Next Question";
        } else {
            submitBtn.textContent = "Show Results";
        }
        
        // Bloquear opciones
        for (let i = 0; i < options.length; i++) {
            options[i].onclick = null;
            options[i].style.cursor = "default";
        }
    }

    function showFinalResults() {
        quizBlock.style.display = "none";
        submitBtn.style.display = "none";
        progressText.style.display = "none";
        
        resultDiv.style.display = "block";
        resultDiv.innerHTML = \`Quiz Completed!<br><span style="color:var(--data-orange); font-size:2.5rem;">\${score} / \${questions.length}</span><br>Great job!<br><br>
        <button onclick="location.reload()" style="background:var(--data-blue); color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-size:1rem;">Retry (New Random Questions)</button>\`;

        // Enviar resultados al Parent LMS (index.html)
        const notaEscalada = Math.round((score / questions.length) * 100);
        window.parent.postMessage({ type: 'QUIZ_COMPLETO', score: notaEscalada, week: 3 }, '*');
    }

    // Initialize
    window.onload = loadQuestion;

</script>
</body>
</html>
