<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Quiz - Data Structures & Loops</title>
    <style>
        :root {
            --unab-blue: #003865;
            --unab-orange: #E85C0B;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            border-top: 8px solid var(--unab-orange);
        }

        h1 {
            color: var(--unab-blue);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--unab-blue);
        }

        .options {
            list-style-type: none;
            padding: 0;
        }

        .options li {
            background-color: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .options li:hover {
            background-color: #e6f0fa;
            border-color: var(--unab-blue);
        }

        .options li.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .options li.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        #submit-btn {
            background-color: var(--unab-orange);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
            font-weight: bold;
            margin-top: 20px;
        }

        #submit-btn:hover {
            background-color: #cc5000;
        }

        #result {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            color: var(--unab-blue);
            display: none;
        }
        
        .progress {
            text-align: right;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>EMI Space Challenge</h1>
    <p class="subtitle">Data Structures & Control Flow</p>

    <div class="progress" id="progressText">Question 1 of 3</div>
    
    <div id="quiz-block">
        <div class="question" id="questionText">Which Python data structure stores key-value pairs?</div>
        <ul class="options" id="optionsList">
            <li onclick="selectOption(this)">List</li>
            <li onclick="selectOption(this)">Tuple</li>
            <li onclick="selectOption(this)">Dictionary</li>
            <li onclick="selectOption(this)">Set</li>
        </ul>
    </div>

    <button id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
    
    <div id="result"></div>
</div>

<script>
    const questions = [
        {
            question: "Which Python data structure stores key-value pairs?",
            options: ["List", "Tuple", "Dictionary", "Set"],
            answer: 2 // Dictionary
        },
        {
            question: "What is the primary purpose of a 'for loop'?",
            options: ["To store data permanently", "To iterate over a sequence of elements", "To handle application errors", "To declare a new function"],
            answer: 1 // Iterate
        },
        {
            question: "In Pandas, what is a DataFrame?",
            options: ["A 1D array of data", "A 2D tabular data structure", "A function that cleans data", "A type of loop"],
            answer: 1 // Tabular
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedOptionIndex = -1;

    const questionText = document.getElementById("questionText");
    const optionsList = document.getElementById("optionsList");
    const progressText = document.getElementById("progressText");
    const submitBtn = document.getElementById("submit-btn");
    const resultDiv = document.getElementById("result");
    const quizBlock = document.getElementById("quiz-block");

    function loadQuestion() {
        selectedOptionIndex = -1;
        const q = questions[currentQuestion];
        questionText.textContent = q.question;
        progressText.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
        
        optionsList.innerHTML = "";
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.textContent = opt;
            li.onclick = () => selectOption(li, index);
            optionsList.appendChild(li);
        });
        
        submitBtn.textContent = "Submit Answer";
    }

    function selectOption(element, index) {
        const options = optionsList.children;
        for (let i = 0; i < options.length; i++) {
            options[i].style.borderColor = "#e0e0e0";
            options[i].style.backgroundColor = "#f9f9f9";
        }
        element.style.borderColor = "var(--unab-blue)";
        element.style.backgroundColor = "#e6f0fa";
        selectedOptionIndex = index;
    }

    function checkAnswer() {
        if (selectedOptionIndex === -1) {
            alert("Please select an option first!");
            return;
        }

        const q = questions[currentQuestion];
        const options = optionsList.children;

        if (submitBtn.textContent === "Next Question" || submitBtn.textContent === "Show Results") {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showFinalResults();
            }
            return;
        }

        // Evaluate answer
        if (selectedOptionIndex === q.answer) {
            options[selectedOptionIndex].classList.add("correct");
            score++;
        } else {
            options[selectedOptionIndex].classList.add("incorrect");
            options[q.answer].classList.add("correct");
        }

        // Update button text
        if (currentQuestion < questions.length - 1) {
            submitBtn.textContent = "Next Question";
        } else {
            submitBtn.textContent = "Show Results";
        }
        
        // Disable further clicks
        for (let i = 0; i < options.length; i++) {
            options[i].onclick = null;
            options[i].style.cursor = "default";
        }
    }

    function showFinalResults() {
        quizBlock.style.display = "none";
        submitBtn.style.display = "none";
        progressText.style.display = "none";
        
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `Quiz Completed!<br><span style="color:var(--unab-orange); font-size:2.5rem;">${score} / ${questions.length}</span><br>Great job utilizing English in Data Science!`;
    }

    // Initialize
    loadQuestion();

</script>
</body>
</html>
