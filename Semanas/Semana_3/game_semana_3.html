<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Gamificado: Semana 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#003865', secondary: '#E85C0B', darkbg: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .card-btn { transition: all 0.3s; cursor: pointer; }
        .card-btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-color: #E85C0B; }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-6">

    <div class="glass-panel w-full max-w-4xl rounded-2xl p-8 relative">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400 mb-2"><i class="fas fa-database text-secondary mr-3"></i>Reto: Clasificación de Datos</h1>
            <p class="text-gray-300">¿El siguiente formato de datos es Estructurado o No Estructurado?</p>
            
            <div class="mt-4 flex justify-center gap-4 text-sm font-bold">
                <div class="bg-primary px-4 py-2 rounded-full">Puntos: <span id="score" class="text-secondary">0</span>/5</div>
            </div>
        </div>

        <div class="text-center mb-10 h-32 flex items-center justify-center">
            <div id="data-item" class="text-4xl font-extrabold text-white fade-in bg-white/10 px-8 py-4 rounded-xl border border-white/20 shadow-lg">
                Cargando...
            </div>
        </div>

        <div class="grid grid-cols-2 gap-6 max-w-2xl mx-auto">
            <button onclick="checkAnswer('estructurado')" class="card-btn glass-panel p-6 rounded-xl text-center flex flex-col items-center gap-3 hover:bg-blue-900/50">
                <i class="fas fa-table text-5xl text-blue-400"></i>
                <span class="font-bold text-xl uppercase tracking-wider">Estructurado</span>
            </button>
            <button onclick="checkAnswer('no_estructurado')" class="card-btn glass-panel p-6 rounded-xl text-center flex flex-col items-center gap-3 hover:bg-orange-900/50">
                <i class="fas fa-photo-video text-5xl text-secondary"></i>
                <span class="font-bold text-xl uppercase tracking-wider">No Estructurado</span>
            </button>
        </div>

        <div id="end-screen" class="absolute inset-0 bg-slate-900/90 backdrop-blur-md rounded-2xl hidden flex-col items-center justify-center z-10 fade-in">
            <i class="fas fa-trophy text-7xl text-yellow-500 mb-6"></i>
            <h2 class="text-4xl font-bold text-white mb-2">¡Nivel Completado!</h2>
            <p class="text-xl text-gray-300 mb-8">Lograste clasificar las fuentes de datos.</p>
            <button onclick="location.reload()" class="bg-secondary text-white font-bold px-8 py-3 rounded-lg hover:bg-orange-600 transition">Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        const items = [
            { text: "Base de Datos SQL (Tablas)", type: "estructurado" },
            { text: "Video de YouTube (MP4)", type: "no_estructurado" },
            { text: "Archivo Excel (.xlsx)", type: "estructurado" },
            { text: "Archivo CSV", type: "estructurado" },
            { text: "Post en Twitter (Texto Libre)", type: "no_estructurado" }
        ];

        let currentItem = 0;
        let score = 0;

        function renderItem() {
            if(currentItem >= items.length) {
                document.getElementById('end-screen').style.display = 'flex';
                return;
            }
            const el = document.getElementById('data-item');
            el.classList.remove('fade-in');
            void el.offsetWidth; // trigger reflow
            el.classList.add('fade-in');
            el.innerText = items[currentItem].text;
        }

        function checkAnswer(selectedType) {
            if(items[currentItem].type === selectedType) {
                score++;
                document.getElementById('score').innerText = score;
                // Efecto visual positivo
                const el = document.getElementById('data-item');
                el.style.borderColor = '#22c55e';
                el.style.color = '#22c55e';
                setTimeout(() => {
                    el.style.borderColor = 'rgba(255,255,255,0.2)';
                    el.style.color = 'white';
                    currentItem++;
                    renderItem();
                }, 400);
            } else {
                // Efecto visual negativo
                const el = document.getElementById('data-item');
                el.style.borderColor = '#ef4444';
                el.style.color = '#ef4444';
                setTimeout(() => {
                    el.style.borderColor = 'rgba(255,255,255,0.2)';
                    el.style.color = 'white';
                }, 400);
            }
        }

        renderItem();
    </script>
</body>
</html>
