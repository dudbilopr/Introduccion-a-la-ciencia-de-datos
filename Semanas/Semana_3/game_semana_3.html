<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Gamificado: Semana 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#003865', secondary: '#E85C0B', darkbg: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            perspective: 1000px;
        }
        
        .memory-card {
            width: 100%;
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            cursor: pointer;
        }
        
        .memory-card.flipped {
            transform: rotateY(180deg);
        }
        
        .front-face, .back-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .front-face {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        
        .back-face {
            background: #E85C0B;
            transform: rotateY(180deg);
        }
        
        .back-face.matched {
            background: #22c55e; /* Green */
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-6">

    <div class="glass-panel w-full max-w-4xl rounded-2xl p-8 relative">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-400 mb-2"><i class="fas fa-brain text-secondary mr-3"></i>Memory Match: Pandas/Numpy</h1>
            <p class="text-gray-300">Encuentra la pareja entre la sintaxis y su concepto correspondiente.</p>
            <div class="text-sm mt-2 text-gray-400">Pares encontrados: <span id="matches-count" class="text-white font-bold">0</span> / 6</div>
        </div>

        <div class="memory-grid" id="game-board">
            <!-- Cards will be generated via JS -->
        </div>

        <div id="end-screen" class="absolute inset-0 bg-slate-900/95 backdrop-blur-xl rounded-2xl hidden flex-col items-center justify-center z-10 fade-in">
            <i class="fas fa-medal text-7xl text-blue-400 mb-6"></i>
            <h2 class="text-4xl font-bold text-white mb-2">¡Memoria Perfecta!</h2>
            <p class="text-xl text-gray-300 mb-8">Has dominado las funciones principales de Análisis de Datos.</p>
            <button onclick="location.reload()" class="bg-secondary text-white font-bold px-8 py-3 rounded-lg hover:bg-orange-600 transition shadow-lg">Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        const cardsData = [
            { id: '1', type: 'code', text: 'pd.DataFrame()' }, { id: '1', type: 'desc', text: 'Tabla de Datos bidimensional' },
            { id: '2', type: 'code', text: 'df.head()' }, { id: '2', type: 'desc', text: 'Ver las primeras 5 filas' },
            { id: '3', type: 'code', text: 'df.info()' }, { id: '3', type: 'desc', text: 'Ver tipos de datos y valores nulos' },
            { id: '4', type: 'code', text: 'df.describe()' }, { id: '4', type: 'desc', text: 'Estadística descriptiva básica' },
            { id: '5', type: 'code', text: 'df["col"].mean()' }, { id: '5', type: 'desc', text: 'Calcular el promedio de una columna' },
            { id: '6', type: 'code', text: 'np.array()' }, { id: '6', type: 'desc', text: 'Matriz vectorizada ultra rápida' }
        ];

        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matches = 0;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createBoard() {
            const board = document.getElementById('game-board');
            const shuffled = shuffle([...cardsData]);
            
            shuffled.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.id = item.id;
                
                // Front face is the logo/question mark
                const front = document.createElement('div');
                front.classList.add('front-face');
                front.innerHTML = '<i class="fas fa-question text-3xl text-gray-400"></i>';
                
                // Back face is the content
                const back = document.createElement('div');
                back.classList.add('back-face');
                // Style code snippets differently
                if(item.type === 'code') {
                    back.innerHTML = `<span class="font-mono bg-black/30 p-2 rounded">${item.text}</span>`;
                } else {
                    back.innerText = item.text;
                }
                
                card.appendChild(front);
                card.appendChild(back);
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.id === secondCard.dataset.id;
            
            if (isMatch) {
                firstCard.querySelector('.back-face').classList.add('matched');
                secondCard.querySelector('.back-face').classList.add('matched');
                disableCards();
                matches++;
                document.getElementById('matches-count').innerText = matches;
                if(matches === 6) {
                    setTimeout(() => {
                        document.getElementById('end-screen').style.display = 'flex';
                    }, 1000);
                }
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        createBoard();
    </script>
</body>
</html>
