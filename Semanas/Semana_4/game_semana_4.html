<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto Gamificado: Semana 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#003865', secondary: '#E85C0B', darkbg: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .tinder-card {
            position: absolute;
            width: 100%;
            height: 100%;
            transition: transform 0.3s, opacity 0.3s;
            transform-origin: 50% 100%;
            will-change: transform, opacity;
            z-index: 10;
        }
        
        .swipe-left { transform: translateX(-150%) rotate(-30deg); opacity: 0; }
        .swipe-right { transform: translateX(150%) rotate(30deg); opacity: 0; }
        
        .badge-keep { position: absolute; top: 20px; left: 20px; border: 4px solid #22c55e; color: #22c55e; font-size: 2rem; font-weight: bold; padding: 5px 10px; border-radius: 10px; transform: rotate(-15deg); opacity: 0; transition: opacity 0.2s;}
        .badge-drop { position: absolute; top: 20px; right: 20px; border: 4px solid #ef4444; color: #ef4444; font-size: 2rem; font-weight: bold; padding: 5px 10px; border-radius: 10px; transform: rotate(15deg); opacity: 0; transition: opacity 0.2s;}

    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-lg relative h-[600px] flex flex-col">
        <div class="text-center mb-4 z-0">
            <h1 class="text-3xl font-bold text-blue-400 mb-2"><i class="fas fa-broom text-secondary mr-3"></i>Data Janitor 3000</h1>
            <p class="text-gray-300 text-sm">Decide rápido: <span class="text-red-400 font-bold">Descartar (Drop)</span> datos basura o <span class="text-green-400 font-bold">Aprobar/Imputar</span> datos salvables.</p>
        </div>

        <div class="relative flex-1 w-full" id="card-container">
            <!-- Cards appended here -->
        </div>

        <div class="flex justify-center gap-8 mt-6 z-0">
            <button onclick="handleBtnClick('drop')" class="w-16 h-16 rounded-full bg-slate-800 border-2 border-red-500 text-red-500 text-2xl hover:bg-red-500 hover:text-white transition shadow-[0_0_15px_rgba(239,68,68,0.3)]"><i class="fas fa-times"></i></button>
            <button onclick="handleBtnClick('keep')" class="w-16 h-16 rounded-full bg-slate-800 border-2 border-green-500 text-green-500 text-2xl hover:bg-green-500 hover:text-white transition shadow-[0_0_15px_rgba(34,197,94,0.3)]"><i class="fas fa-check"></i></button>
        </div>

        <div id="end-screen" class="absolute inset-0 bg-slate-900/95 backdrop-blur-xl rounded-2xl hidden flex-col items-center justify-center z-50 fade-in">
            <i class="fas fa-star text-7xl text-yellow-400 mb-6"></i>
            <h2 class="text-4xl font-bold text-white mb-2">¡Dataset Limpio!</h2>
            <p class="text-xl text-gray-300 mb-4">Puntuación: <span id="final-score" class="text-blue-400 font-bold">0</span>/5</p>
            <p class="text-md text-gray-400 mb-8 text-center px-4" id="feedback-msg"></p>
            <button onclick="location.reload()" class="bg-secondary text-white font-bold px-8 py-3 rounded-lg hover:bg-orange-600 transition shadow-lg">Otra Limpieza</button>
        </div>
    </div>

    <script>
        const dataRows = [
            { id: 1, text: "Edad: 1500 años<br>Salario: $50,000<br>Ocupación: Ingeniero", action: 'drop', reason: "La edad es biológicamente imposible (ruido/basura extremo)." },
            { id: 2, text: "Edad: 35 años<br>Salario: NaN<br>Ocupación: Médico", action: 'keep', reason: "El salario nulo se puede imputar con la mediana de los médicos." },
            { id: 3, text: "ID: NaN<br>Nombre: NaN<br>Edad: NaN", action: 'drop', reason: "Fila completamente vacía, no aporta ninguna información." },
            { id: 4, text: "Edad: 22 años<br>Salario: $25,000<br>Género: N/A", action: 'keep', reason: "El género ausente puede ser imputado con la moda o dejado como 'Desconocido'." },
            { id: 5, text: "Edad: -5 años<br>Salario: -$10,000<br>Ocupación: NaN", action: 'drop', reason: "Valores numéricos negativos sin sentido para edad y salario." }
        ].reverse(); // Reverse so we can pop from end (top of visual stack)

        let score = 0;
        let currentIndex = 5;

        function createCard(data, index) {
            const card = document.createElement('div');
            card.className = 'tinder-card glass-panel rounded-2xl bg-slate-800 border-2 border-slate-600 shadow-xl flex flex-col justify-center p-8';
            card.style.zIndex = index;
            card.dataset.action = data.action;
            card.dataset.reason = data.reason;
            
            card.innerHTML = `
                <div class="badge-keep">APROBAR</div>
                <div class="badge-drop">DROP</div>
                <div class="mb-6">
                    <h3 class="text-gray-400 text-sm font-bold uppercase tracking-widest mb-1">Fila de Datos #${5 - index}</h3>
                    <div class="w-full h-1 bg-slate-700 rounded-full"></div>
                </div>
                <div class="font-mono text-xl text-blue-200 leading-loose">
                    ${data.text}
                </div>
            `;
            return card;
        }

        function initCards() {
            const container = document.getElementById('card-container');
            dataRows.forEach((data, i) => {
                container.appendChild(createCard(data, i));
            });
        }

        function handleBtnClick(userAction) {
            const container = document.getElementById('card-container');
            const cards = container.querySelectorAll('.tinder-card:not(.swipe-left):not(.swipe-right)');
            if (cards.length === 0) return;
            
            const topCard = cards[cards.length - 1];
            const correctAction = topCard.dataset.action;
            
            // Show badge
            if(userAction === 'keep') {
                topCard.querySelector('.badge-keep').style.opacity = '1';
                topCard.classList.add('swipe-right');
            } else {
                topCard.querySelector('.badge-drop').style.opacity = '1';
                topCard.classList.add('swipe-left');
            }

            if(userAction === correctAction) {
                score++;
            }

            setTimeout(() => {
                topCard.style.display = 'none';
                currentIndex--;
                if(currentIndex === 0) {
                    showEndScreen();
                }
            }, 300);
        }

        function showEndScreen() {
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('final-score').innerText = score;
            let msg = "";
            if(score === 5) msg = "¡Impecable! Eres un verdadero Data Janitor. Sabes distinguir el ruido de los datos útiles.";
            else if(score >= 3) msg = "Buen trabajo, pero algunos algoritmos podrían envenenarse con las filas que dejaste pasar.";
            else msg = "Cuidado. Eliminar datos útiles o aprobar basura destruye cualquier modelo de Machine Learning.";
            document.getElementById('feedback-msg').innerText = msg;
        }

        initCards();
    </script>
</body>
</html>
