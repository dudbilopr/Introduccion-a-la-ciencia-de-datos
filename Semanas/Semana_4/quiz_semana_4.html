{"q": "df.isna().sum().sum() returns 0 for the census data, but 1,836 workclass values are \"?\". What does this mean?", "o": ["There are no missing values", "Missing values are disguised as text, so pandas cannot see them", "The question marks are real job types", "isna() is broken"], "a": 1, "e": "Always inspect value_counts(): missing values can hide as \"?\", 0, 99 or empty strings."},
{"q": "Among people with no workclass, 34.4 % are under 25, against 16.1 % of the rest. Are these values missing completely at random?", "o": ["Yes, they are random", "No: missingness depends on age, an observed variable", "We cannot say anything", "Only if the sample is large"], "a": 1, "e": "This rules out MCAR. It is compatible with MAR; MNAR cannot be tested with these data alone."},
{"q": "Dropping every row with a \"?\" removes 7.4 % of the data and the high-income rate goes from 24.1 % to 24.9 %. Why?", "o": ["Rounding error", "The removed rows had fewer high incomes (13.9 %), so the remaining sample is biased", "More rows always raise the rate", "Duplicates were removed"], "a": 1, "e": "Dropping is a decision with consequences: it removes many students and retirees."},
{"q": "After imputing missing occupations with the mode (Prof-specialty), its high-income rate drops from 44.9 % to 34.3 %. What happened?", "o": ["Professionals earn less now", "People who were not professionals were added to that group", "The mode was miscalculated", "Nothing important"], "a": 1, "e": "Mode imputation changes relationships between variables. A separate \"Unknown\" category is more honest."},
{"q": "With Q1 = 40 and Q3 = 45, the IQR rule flags 9,008 rows (27.7 %) as outliers in hours per week. What is the best reading?", "o": ["A quarter of the census is wrong", "The rule fails because 46.7 % of people work exactly 40 hours and the box is very narrow", "Those rows must be deleted", "The data are fake"], "a": 1, "e": "Outlier rules assume a shape. Look at the histogram before applying any formula."},
{"q": "There are 43 people aged 90 and none aged 89. What is the most likely explanation?", "o": ["A baby boom in 1904", "Ages were top-coded: 90 means \"90 or older\"", "People aged 89 refused to answer", "A typing error"], "a": 1, "e": "Top-coding protects privacy and limits extreme values. Document it; do not treat 90 as an exact age."}
]};</script>
