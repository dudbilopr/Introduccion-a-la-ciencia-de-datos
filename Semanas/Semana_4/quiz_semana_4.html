<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Challenge - Week 4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #003865;
            --secondary: #E85C0B;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: #fff;
            border-top: 5px solid var(--secondary);
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--secondary);
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 600;
            text-align: left;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background-color: #f1f5f9;
            border: 2px solid #e2e8f0;
            color: var(--primary);
            padding: 15px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-weight: 500;
        }

        .option-btn:hover {
            background-color: #e2e8f0;
            border-color: var(--primary);
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 30px;
        }

        .feedback.success { color: #166534; }
        .feedback.error { color: #991b1b; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .next-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            display: none;
            transition: background-color 0.3s;
        }

        .next-btn:hover { background-color: #c44d09; }

        .score-container {
            display: none;
        }

        .score-container i {
            font-size: 4rem;
            color: #f59e0b;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizContainer">
        <h1>EMI Challenge</h1>
        <div class="subtitle">Data Visualization & Preprocessing</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="questionArea">
            <div class="question-text" id="questionText">Loading question...</div>
            <div class="options-grid" id="optionsGrid">
                <!-- Options injected by JS -->
            </div>
            <div class="feedback" id="feedbackMsg"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question <i class="fas fa-arrow-right"></i></button>
        </div>

        <div class="score-container" id="scoreContainer">
            <i class="fas fa-trophy"></i>
            <h2 style="color: var(--primary);">Challenge Completed!</h2>
            <p class="question-text" style="text-align: center;">Your score: <span id="finalScore" style="color: var(--secondary); font-size: 1.5em;">0</span> / 4</p>
            <p>Dopamine level: <strong style="color:#22c55e;">Maximum</strong></p>
            <button class="next-btn" style="display:inline-block;" onclick="location.reload()">Retry Challenge</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Which Pandas method is commonly used to remove rows containing missing values (NaN)?",
                options: ["df.remove_nan()", "df.dropna()", "df.delete_null()", "df.clean()"],
                correct: 1
            },
            {
                question: "What is the primary purpose of a 'Scatter Plot' in data visualization?",
                options: [
                    "To show the relationship or correlation between two numerical variables.",
                    "To compare the total sales across different categories.",
                    "To display the distribution of a single variable.",
                    "To show the percentage of a whole (like a pie chart)."
                ],
                correct: 0
            },
            {
                question: "Which Python library is best known for creating interactive, web-ready dashboards with zoom and hover capabilities?",
                options: ["Matplotlib", "Seaborn", "Plotly", "Numpy"],
                correct: 2
            },
            {
                question: "What does the term 'Outlier' mean in data science?",
                options: [
                    "A variable that is stored outside the main database.",
                    "A data point that differs significantly from other observations.",
                    "A function used to export data to a CSV file.",
                    "A specific type of machine learning algorithm."
                ],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const questionText = document.getElementById('questionText');
        const optionsGrid = document.getElementById('optionsGrid');
        const feedbackMsg = document.getElementById('feedbackMsg');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');

        function loadQuestion() {
            feedbackMsg.innerHTML = '';
            feedbackMsg.className = 'feedback';
            nextBtn.style.display = 'none';
            
            const q = questions[currentQuestion];
            questionText.innerHTML = `<i class="fas fa-question-circle" style="color: var(--secondary); margin-right:8px;"></i> ${q.question}`;
            
            optionsGrid.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsGrid.appendChild(btn);
            });

            progressFill.style.width = `${(currentQuestion / questions.length) * 100}%`;
        }

        function checkAnswer(selectedIndex, btnElement) {
            // Disable all buttons
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            const correctIndex = questions[currentQuestion].correct;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                feedbackMsg.innerHTML = '<i class="fas fa-check-circle"></i> Excellent! That is correct.';
                feedbackMsg.className = 'feedback success';
                score++;
            } else {
                btnElement.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct');
                feedbackMsg.innerHTML = '<i class="fas fa-times-circle"></i> Incorrect. Review the concepts!';
                feedbackMsg.className = 'feedback error';
            }

            nextBtn.style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showScore();
            }
        }

        function showScore() {
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('scoreContainer').style.display = 'block';
            document.getElementById('finalScore').innerText = score;
        }

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
